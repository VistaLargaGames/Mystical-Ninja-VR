plugins {
    id "com.android.application"
}

android {
    namespace "com.goemon64.recompiled"
    compileSdk 35
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.goemon64.recompiled"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
            pickFirsts += ["**/libc++_shared.so"]
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ["${rootDir}/../out/build/android-quest/jniLibs"]
            assets.srcDirs = ["${rootDir}/../out/build/android-quest/apk-assets"]
            java.srcDirs = ["${rootDir}/../out/build/android-quest/sdl-java", "src/main/java"]
        }
    }
}

dependencies {
    implementation "org.khronos.openxr:openxr_loader_for_android:1.1.47"
}
